[package]
name = "tlb_sim"
version = "0.2.0"
edition = "2024"

[lib]
name = "tlb_sim_lib"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "tlb_sim"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
